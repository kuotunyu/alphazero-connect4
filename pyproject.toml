[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphazero-connect4"
version = "0.1.0"
description = "AlphaZero-style self-play Connect Four agent (bitboard + batched MCTS + small ResNet)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "tqdm",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
hub = ["huggingface_hub>=0.30", "safetensors>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
