name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # Release tests build the real Gradio component tree, while stubbing
      # only the heavyweight torch-backed model boundary.
      - run: python -m pip install --upgrade pip numpy pytest gradio==6.20.0
      - run: python -m pip install --no-deps -e .
      - run: python -c "import az; print(az.__file__)"
      - run: python -m pytest tests -q
