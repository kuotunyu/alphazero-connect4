name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Unit tests cover the engine/search/result contracts and do not need
      # the heavyweight torch training dependency.
      - run: python -m pip install --upgrade pip numpy pytest
      - run: python -m pip install --no-deps -e .
      - run: python -c "import az; print(az.__file__)"
      - run: python -m pytest tests -q
